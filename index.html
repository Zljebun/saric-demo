<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kancelarija Sarić — Sistem za vođenje predmeta (demo)</title>
<style>
  :root{
    --brand:#0e4f5c; --brand2:#15748a; --gold:#c79a3b; --action:#157f7f;
    --bg:#f2f6f7; --card:#fff; --line:#e1e8ea; --muted:#65737a;
    --ok:#1f9d55; --warn:#d9822b; --late:#cc2f2f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#16242a}
  /* Header / brand */
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:11px 20px;display:flex;align-items:center;gap:13px}
  .monogram{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.5px}
  .brand .name{font-weight:700;font-size:16px;line-height:1}
  .brand .tag{font-size:11.5px;color:var(--gold);letter-spacing:.4px;margin-top:3px}
  header .spacer{flex:1}
  header .badge{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px;font-size:11.5px}
  header .user{display:flex;align-items:center;gap:8px;font-size:13px}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  /* Toolbar with tabs */
  .toolbar{display:flex;align-items:center;gap:6px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
  .tab{padding:14px 14px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
  .tab.active{color:var(--brand);border-bottom-color:var(--gold)}
  .demo-flag{margin-left:12px;background:#fff4e5;color:#9a5b13;border:1px solid #f0d2a8;padding:4px 10px;border-radius:6px;font-size:12px;align-self:center}
  /* Kanban */
  .board{display:flex;gap:14px;padding:18px 20px;overflow-x:auto;align-items:flex-start}
  .col{background:#e9eff0;border:1px solid var(--line);border-radius:10px;min-width:248px;max-width:248px;display:flex;flex-direction:column}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--brand);margin:0;padding:12px 12px 8px}
  .col .count{color:var(--muted);font-weight:500}
  .col .cards{padding:0 10px 12px;display:flex;flex-direction:column;gap:9px;min-height:30px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;box-shadow:0 1px 2px rgba(20,40,50,.05);transition:.12s}
  .pcard:hover{box-shadow:0 4px 12px rgba(20,50,60,.13);transform:translateY(-1px);border-color:#c5d3d6}
  .pcard .nm{font-weight:650;font-size:14px}
  .pcard .visa{font-size:12px;color:var(--muted);margin-top:1px}
  .pcard .meta{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px}
  .pill{padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.days{background:#e6f2f3;color:#15677a}
  .pill.late{background:#fdecec;color:var(--late)}
  .pill.done{background:#e7f6ee;color:var(--ok)}
  .pcard .who{margin-left:auto}
  /* Report */
  .report{padding:20px}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 18px;min-width:170px;flex:1}
  .stat .big{font-size:30px;font-weight:700;color:var(--brand)}
  .stat .lab{font-size:12.5px;color:var(--muted);margin-top:3px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--brand)}
  .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar .blab{width:210px;color:#2a3a40}
  .bar .track{flex:1;background:#eef2f3;border-radius:6px;height:18px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand2),var(--brand))}
  .bar .fill.max{background:linear-gradient(90deg,#e0913a,var(--late))}
  .bar .val{width:64px;text-align:right;color:var(--muted)}
  .wl{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
  .wl .who{margin-left:auto;font-weight:600;color:var(--brand)}
  .latebox{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:13.5px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fffafa;cursor:pointer;transition:.12s}
  .latebox:hover{border-color:#e3a0a0;box-shadow:0 3px 10px rgba(120,30,30,.1);transform:translateY(-1px)}
  .latebox .pill{margin-left:auto}
  /* Dashboard */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;box-shadow:0 1px 3px rgba(20,50,60,.05)}
  .kpi .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:9px;background:#eef2f3}
  .kpi .ic.blue{background:#e6f2f3}.kpi .ic.green{background:#e7f6ee}.kpi .ic.amber{background:#fff4e5}
  .kpi .big{font-size:27px;font-weight:800;line-height:1;color:var(--brand)}
  .kpi .lab{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.25}
  .kpi.accent-red .big{color:var(--late)}.kpi.accent-red .ic{background:#fdecec}
  .kpi.bottleneck{background:linear-gradient(135deg,#fff,#fff6ec);border-color:#f0d2a8}
  .kpi.bottleneck .big{font-size:15px;color:var(--late);margin-top:3px}
  .grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:16px}
  .donut-wrap{display:flex;align-items:center;gap:14px}
  .legend{flex:1;font-size:13px}
  .legend .li{display:flex;align-items:center;gap:8px;padding:4px 0}
  .legend .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .legend .lc{margin-left:auto;color:var(--muted);font-weight:600;white-space:nowrap}
  .cols{display:flex;align-items:flex-end;gap:10px;height:185px;padding-top:6px}
  .colbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .colbar .cnt{font-size:15px;font-weight:800;color:var(--brand);margin-bottom:5px}
  .colbar .barv{width:100%;border-radius:7px 7px 0 0;min-height:4px;transform-origin:bottom;animation:growV .7s cubic-bezier(.2,.8,.2,1) both}
  .colbar .clab{font-size:9.5px;color:var(--muted);text-align:center;margin-top:7px;line-height:1.15;height:30px;overflow:hidden}
  @keyframes growV{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .bar .fill{transform-origin:left;animation:growH .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes growH{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .donseg{animation:fadeSeg .6s ease both}
  @keyframes fadeSeg{from{opacity:0}to{opacity:1}}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
  /* Dossier modal */
  .overlay{position:fixed;inset:0;background:rgba(10,25,30,.5);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .dossier{background:#fff;border-radius:14px;max-width:930px;width:100%;box-shadow:0 20px 60px rgba(5,20,25,.35);overflow:hidden}
  .dhead{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 22px;display:flex;align-items:flex-start;gap:14px}
  .dhead .x{margin-left:auto;cursor:pointer;font-size:22px;opacity:.85;line-height:1}
  .dhead h2{margin:0;font-size:20px}
  .dhead .tags{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
  .dhead .tag{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:6px}
  .dbody{display:grid;grid-template-columns:1.1fr 1fr}
  .dcol{padding:18px 22px}
  .dcol+.dcol{border-left:1px solid var(--line)}
  .sec{margin-bottom:20px}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--brand);margin:0 0 9px}
  .kv{display:flex;font-size:13.5px;padding:3px 0}
  .kv .k{width:120px;color:var(--muted)}
  .kv .v{font-weight:550}
  .doc{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
  .doc .ext{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px}
  .ext.pdf{background:#cc2f2f}.ext.jpg,.ext.jpeg{background:#2f80ed}.ext.xlsx,.ext.xls{background:#1f9d55}
  .docbtn{margin-top:8px;width:100%;background:#fff;border:1px dashed #b9c6cc;color:var(--brand);padding:9px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .docbtn:hover{background:#eef4f5;border-color:var(--brand)}
  .doc .dmeta{margin-left:auto;color:var(--muted);font-size:11.5px;text-align:right}
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:5px;top:3px;bottom:3px;width:2px;background:var(--line)}
  .tl .item{position:relative;padding:0 0 14px}
  .tl .item::before{content:"";position:absolute;left:-16px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand2)}
  .tl .item.done::before{background:var(--ok);border-color:var(--ok)}
  .tl .item.curr::before{background:var(--warn);border-color:var(--warn)}
  .tl .t{font-size:13.5px;font-weight:600}
  .tl .d{font-size:11.5px;color:var(--muted)}
  .cthread{max-height:320px;overflow-y:auto;padding-right:4px;margin-top:6px}
  .cmsg{display:flex;gap:9px;margin-bottom:10px}
  .cav{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;margin-top:1px}
  .cbubble{flex:1;background:#f4f7fa;border:1px solid var(--line);border-radius:11px;border-top-left-radius:3px;padding:8px 11px;min-width:0}
  .chead{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .chead b{color:#16242a;font-size:12.5px}
  .ctime{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
  .ctext{font-size:13px;color:#1a2230;line-height:1.45;word-wrap:break-word}
  .cthread::-webkit-scrollbar{width:7px}.cthread::-webkit-scrollbar-thumb{background:#cfd8de;border-radius:4px}
  .actions{padding:14px 22px;background:#f5f9fa;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
  button.primary{background:var(--action);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13.5px}
  button.primary:hover{filter:brightness(1.08)}
  button.secondary{background:#fff;color:var(--brand);border:1px solid #c5d3d6;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13.5px}
  button.secondary:hover{background:#eef4f5}
  .newbtn{margin-left:auto;background:var(--action);color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;align-self:center}
  .newbtn:hover{filter:brightness(1.08)}
  .analyze-btn{margin-left:auto;background:var(--action);color:#fff;border:0;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .analyze-btn:hover{filter:brightness(1.08)}
  .frow{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
  .frow label{font-size:12px;color:var(--muted);font-weight:600}
  .frow input,.frow select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  .frow input:focus,.frow select:focus{outline:none;border-color:var(--brand2)}
  .addcom{display:flex;gap:8px;margin-bottom:12px}
  .addcom input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
  .addcom input:focus{outline:none;border-color:var(--brand2)}
  .addcom button{padding:8px 14px;font-size:13px;border:0;border-radius:8px;background:var(--action);color:#fff;font-weight:600;cursor:pointer}
  .addcom button:hover{filter:brightness(1.08)}
  .actions .note{font-size:12px;color:var(--muted)}
  .audit{font-size:11.5px;color:var(--muted)}
  .audit .row{padding:2px 0}
  .atl{position:relative;padding-left:20px;margin-top:2px;max-height:300px;overflow-y:auto;padding-right:4px}
  .atl::-webkit-scrollbar{width:7px}.atl::-webkit-scrollbar-thumb{background:#cfd8de;border-radius:4px}
  .atl::before{content:"";position:absolute;left:6px;top:5px;bottom:6px;width:2px;background:var(--line)}
  .atl .ai{position:relative;padding:0 0 13px}
  .atl .ai:last-child{padding-bottom:0}
  .atl .ai::before{content:"";position:absolute;left:-17px;top:3px;width:11px;height:11px;border-radius:50%;background:currentColor;border:2px solid #fff;box-shadow:0 0 0 1.5px currentColor}
  .atl .ai.open{color:#2f80ed}.atl .ai.handoff{color:var(--brand)}.atl .ai.done{color:var(--ok)}.atl .ai.comment{color:#8a93a0}.atl .ai.return{color:var(--warn)}
  .atl .ad{font-size:10.5px;font-weight:700;color:#16242a;letter-spacing:.2px}
  .atl .al{font-size:13px;color:#16242a;margin-top:1px;font-weight:550}
  .atl .ae{font-size:11.5px;color:var(--muted);margin-top:1px}
  footer{padding:14px 20px;color:var(--muted);font-size:12px;text-align:center}
  @media(max-width:760px){.dbody{grid-template-columns:1fr}.dcol+.dcol{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>

<header>
  <div class="monogram">KS</div>
  <div class="brand">
    <div class="name">Kancelarija Sarić</div>
    <div class="tag">Do vize bez stresa</div>
  </div>
  <div class="spacer"></div>
  <div class="user">
    <span class="avatar" style="background:#b1442f">NM</span>
    <span>Nela Marinković — direktorica</span>
  </div>
</header>

<div class="toolbar">
  <div class="tab active" id="tab-board" onclick="setView('board')">Pregled predmeta</div>
  <div class="tab" id="tab-report" onclick="setView('report')">Izvještaji</div>
  <button class="newbtn" onclick="openNewCase()">+ Novi predmet</button>
  <span class="demo-flag">DEMO — faze i podaci su primjer, prilagođava se vašem procesu</span>
</div>

<div id="view"></div>

<footer>Demo prototip · podaci su izmišljeni · © Datamaks</footer>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeDossier()">
  <div class="dossier" id="dossier"></div>
</div>

function av(c,small){const w=WORKERS[c];const s=small?'width:20px;height:20px;font-size:10px;':'';return `<span class="avatar" style="${s}background:${w.boja}" title="${w.ime} — ${w.uloga}">${c}</span>`;}

let CASES = [

// ---- View switching --------------------------------------------------------
let view="board";
function setView(v){
  view=v;
  document.getElementById("tab-board").classList.toggle("active",v==="board");
  document.getElementById("tab-report").classList.toggle("active",v==="report");
  v==="board"?renderBoard():renderReport();
}

// ---- Kanban ----------------------------------------------------------------
function renderBoard(){
  const el=document.getElementById("view");
  const board=document.createElement("div"); board.className="board";
  PHASES.forEach((ph,i)=>{
    const inCol=CASES.filter(c=>c.phase===i);
    const col=document.createElement("div"); col.className="col";
    col.innerHTML=`<h2>${ph} <span class="count">(${inCol.length})</span></h2><div class="cards"></div>`;
    const cards=col.querySelector(".cards");
    inCol.forEach(c=>{
      const late=c.days>=5 && !c.done;
      const daysPill=c.done?`<span class="pill done">završeno</span>`
        :`<span class="pill ${late?'late':'days'}">${c.days} ${c.days===1?'dan':'dana'} u fazi</span>`;
      const card=document.createElement("div"); card.className="pcard"; card.onclick=()=>openDossier(c.id);
      card.innerHTML=`<div class="nm">${c.ime}</div><div class="visa">${c.visa} · ${c.id}</div>
        <div class="meta">${daysPill}<span class="who">${av(c.worker,true)}</span></div>`;
      cards.appendChild(card);
    });
    board.appendChild(col);
  });
  el.replaceChildren(board);
}

// ---- Izvještaji ------------------------------------------------------------
function donutSVG(segs,total){
  const r=52,C=2*Math.PI*r;let off=0;
  const arcs=segs.filter(s=>s.value>0).map(s=>{
    const len=s.value/total*C;
    const el=`<circle class="donseg" cx="70" cy="70" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-linecap="butt" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    off+=len;return el;
  }).join("");
  return `<svg viewBox="0 0 140 140" width="150" height="150" style="flex:0 0 auto">${arcs}
    <text x="70" y="66" text-anchor="middle" font-size="25" font-weight="800" fill="#16242a">${total}</text>
    <text x="70" y="85" text-anchor="middle" font-size="10" fill="#65737a">predmeta</text></svg>`;
}

// Scatter (kvadrant): X=opterećenje, Y=brzina (Ø dana/fazi). Gore=sporije, desno=pretrpaniji.
function scatterSVG(pts){
  if(pts.length<1) return "<div style='color:var(--muted);font-size:13px'>Nema dovoljno podataka.</div>";
  const W=580,H=340,ml=54,mr=120,mt=22,mb=46,plotW=W-ml-mr,plotH=H-mt-mb;
  const xMax=Math.max(2,...pts.map(p=>p.x))+1;
  const yMax=Math.max(1,...pts.map(p=>p.y))*1.18;
  const avgX=pts.reduce((a,p)=>a+p.x,0)/pts.length;
  const avgY=pts.reduce((a,p)=>a+p.y,0)/pts.length;
  const px=x=>ml+(x/xMax)*plotW, py=y=>mt+(1-y/yMax)*plotH;
  const y0=py(0);
  let yg="";
  for(let i=0;i<=4;i++){const val=Math.round(yMax*i/4),Y=py(val);
    yg+=`<line x1="${ml}" y1="${Y}" x2="${ml+plotW}" y2="${Y}" stroke="#eef2f3"/><line x1="${ml-4}" y1="${Y}" x2="${ml}" y2="${Y}" stroke="#9aa6aa"/><text x="${ml-8}" y="${Y+3}" text-anchor="end" font-size="9" fill="#65737a">${val}</text>`;}
  let xg="";
  for(let i=0;i<=xMax;i++){const X=px(i);
    xg+=`<line x1="${X}" y1="${y0}" x2="${X}" y2="${y0+4}" stroke="#9aa6aa"/><text x="${X}" y="${y0+16}" text-anchor="middle" font-size="9" fill="#65737a">${i}</text>`;}
  const vx=px(avgX),hy=py(avgY);
  const quad=`<line x1="${vx}" y1="${mt}" x2="${vx}" y2="${mt+plotH}" stroke="#c5cfd2" stroke-dasharray="4 4"/><line x1="${ml}" y1="${hy}" x2="${ml+plotW}" y2="${hy}" stroke="#c5cfd2" stroke-dasharray="4 4"/>`;
  const L=(x,y,a,t,c)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="9.5" font-weight="700" fill="${c}" opacity="0.85">${t}</text>`;
  const corners=L(ml+7,mt+13,"start","spor • rasterećen","#cc2f2f")+L(ml+plotW-7,mt+13,"end","spor • PRETRPAN","#d9822b")
    +L(ml+7,mt+plotH-7,"start","brz • rasterećen","#1f9d55")+L(ml+plotW-7,mt+plotH-7,"end","brz • pod pritiskom","#1f9d6b");
  const bub=pts.map(p=>{const cx=px(p.x),cy=py(p.y);
    return `<g><circle cx="${cx}" cy="${cy}" r="15" fill="${WORKERS[p.w].boja}" opacity="0.9" stroke="#fff" stroke-width="2"><title>${WORKERS[p.w].ime} — ${WORKERS[p.w].uloga} · opterećenje: ${p.x} · brzina: Ø ${p.y} dana/fazi (${p.n} faza)</title></circle><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" pointer-events="none">${p.w}</text></g>`;}).join("");
  let leg="";
  pts.forEach((p,i)=>{const ly=mt+12+i*18;leg+=`<circle cx="${ml+plotW+20}" cy="${ly-4}" r="6" fill="${WORKERS[p.w].boja}"/><text x="${ml+plotW+30}" y="${ly}" font-size="9.5" fill="#16242a">${WORKERS[p.w].ime}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block">
    ${yg}${xg}${quad}${corners}
    <line x1="${ml}" y1="${y0}" x2="${ml+plotW}" y2="${y0}" stroke="#9aa6aa"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${y0}" stroke="#9aa6aa"/>
    <text x="${ml+plotW/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#65737a">Opterećenje (aktivni predmeti) →</text>
    <text transform="translate(13 ${mt+plotH/2}) rotate(-90)" text-anchor="middle" font-size="10" fill="#65737a">↑ Sporije  /  Brže ↓</text>
    ${bub}${leg}</svg>`;
}

// Podaci za scatter (radnik: opterećenje x, brzina y, broj faza n)
function computeScatterPts(){
  const active=CASES.filter(c=>!c.done);
  const load={}; active.forEach(c=>load[c.worker]=(load[c.worker]||0)+1);
  const wTime={};
  CASES.forEach(c=>c.hist.forEach(h=>{ if(h[3]){ const w=code(h[4]); if(w){ (wTime[w]=wTime[w]||{sum:0,n:0}); wTime[w].sum+=durDays(h[2],h[3]); wTime[w].n++; } } }));
  return Object.keys(wTime).map(w=>({w,x:(load[w]||0),y:Math.round(wTime[w].sum/wTime[w].n*10)/10,n:wTime[w].n}));
}
// Modal: analiza rada (scatter u punom prostoru)
function openAnalysis(){
  const pts=computeScatterPts();
  document.getElementById("dossier").innerHTML=`
    <div class="dhead"><div><h2>Analiza rada — brzina vs opterećenje</h2>
      <div class="tags"><span class="tag">${pts.length} radnika</span></div></div>
      <div class="x" onclick="closeDossier()">×</div></div>
    <div style="padding:18px 22px">
      ${scatterSVG(pts)}
      <p style="color:var(--muted);font-size:13px;margin:14px 0 0;line-height:1.5">Svaki krug je radnik. <b>Desno</b> = veće opterećenje (aktivni predmeti), <b>gore</b> = sporiji (Ø dana po fazi). Isprekidane linije su prosjek. <b>Gornji-desni</b> kvadrant = radnik je spor <b>jer je pretrpan</b>; <b>gornji-lijevi</b> = spor <b>iako rasterećen</b> (stvarno spor). Pređi mišem preko kruga za detalje.</p>
    </div>`;
  document.getElementById("overlay").classList.add("open");
}

function renderReport(){
  const el=document.getElementById("view");
  const active=CASES.filter(c=>!c.done);
  const doneC=CASES.filter(c=>c.done);
  const totals=CASES.map(c=>durDays(c.otvoren, c.done?c.hist[c.hist.length-1][3]:todayStr()));
  const avgTotal=Math.round(totals.reduce((a,b)=>a+b,0)/totals.length);
  const perPhase=PHASES.map(()=>[]);
  CASES.forEach(c=>c.hist.forEach(h=>{ if(h[3]) perPhase[h[0]].push(durDays(h[2],h[3])); }));
  const phaseAvg=perPhase.map(a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0);
  const maxAvg=Math.max(...phaseAvg);
  const slowIdx=phaseAvg.indexOf(maxAvg);
  const load={}; active.forEach(c=>load[c.worker]=(load[c.worker]||0)+1);
  const maxLoad=Math.max(1,...Object.values(load));
  const late=active.filter(c=>c.days>=5);
  const phaseCount=PHASES.map((_,i)=>CASES.filter(c=>c.phase===i).length);
  const maxCount=Math.max(1,...phaseCount);
  const visaCounts={}; CASES.forEach(c=>visaCounts[c.visa]=(visaCounts[c.visa]||0)+1);
  const visaSegs=Object.keys(visaCounts).sort((a,b)=>visaCounts[b]-visaCounts[a]).map((v,i)=>({label:v,value:visaCounts[v],color:VISA_COLORS[i%VISA_COLORS.length]}));

  const kpis=`<div class="kpis">
    <div class="kpi"><div class="ic blue">📂</div><div class="big">${active.length}</div><div class="lab">Aktivnih predmeta</div></div>
    <div class="kpi"><div class="ic green">✅</div><div class="big">${doneC.length}</div><div class="lab">Završeno (ovaj mjesec)</div></div>
    <div class="kpi"><div class="ic blue">⏱️</div><div class="big">${avgTotal}</div><div class="lab">Prosj. trajanje predmeta (dana)</div></div>
    <div class="kpi accent-red"><div class="ic">⚠️</div><div class="big">${late.length}</div><div class="lab">Predmeta koji kasne</div></div>
    <div class="kpi bottleneck"><div class="ic amber">🐢</div><div class="lab" style="font-weight:600">Usko grlo (najsporija faza)</div><div class="big">${PHASES[slowIdx]}</div><div class="lab">Ø ${maxAvg} dana po predmetu</div></div>
  </div>`;

  const colChart=PHASES.map((p,i)=>{
    const h=Math.max(6,Math.round(phaseCount[i]/maxCount*135));
    return `<div class="colbar"><div class="cnt">${phaseCount[i]}</div>
      <div class="barv" style="height:${h}px;background:linear-gradient(180deg,${PHASE_COLORS[i]},${PHASE_COLORS[i]}bb)"></div>
      <div class="clab">${p}</div></div>`;
  }).join("");

  const legend=visaSegs.map(s=>`<div class="li"><span class="dot" style="background:${s.color}"></span>${s.label}<span class="lc">${s.value} · ${Math.round(s.value/CASES.length*100)}%</span></div>`).join("");

  const bars=phaseAvg.map((v,i)=>`
    <div class="bar"><span class="blab">${PHASES[i]}</span>
      <span class="track"><span class="fill ${i===slowIdx?'max':''}" style="width:${maxAvg?Math.max(6,v/maxAvg*100):0}%"></span></span>
      <span class="val">${v} dana</span></div>`).join("");

  const loadRows=Object.keys(load).sort((a,b)=>load[b]-load[a]).map(k=>
    `<div class="bar"><span class="blab" style="width:auto;min-width:180px;display:flex;align-items:center;gap:8px">${av(k,true)} ${WORKERS[k].ime}</span>
      <span class="track"><span class="fill" style="width:${Math.max(8,load[k]/maxLoad*100)}%"></span></span>
      <span class="val">${load[k]} ${load[k]===1?'predmet':'predmeta'}</span></div>`).join("");

  // brzina rada po radniku: prosječno trajanje završenih faza koje je radnik obradio
  const wTime={};
  CASES.forEach(c=>c.hist.forEach(h=>{
    if(h[3]){ const w=code(h[4]); if(w){ (wTime[w]=wTime[w]||{sum:0,n:0}); wTime[w].sum+=durDays(h[2],h[3]); wTime[w].n++; } }
  }));
  const wAvg=Object.keys(wTime).map(w=>({w,avg:Math.round(wTime[w].sum/wTime[w].n*10)/10,n:wTime[w].n}));
  const maxW=Math.max(1,...wAvg.map(x=>x.avg)), minW=Math.min(...wAvg.map(x=>x.avg));
  const speedRows=wAvg.sort((a,b)=>a.avg-b.avg).map(x=>{
    const col=x.avg===minW?"#1f9d55":(x.avg===maxW?"#cc2f2f":"");
    return `<div class="bar"><span class="blab" style="width:auto;min-width:180px;display:flex;align-items:center;gap:8px">${av(x.w,true)} ${WORKERS[x.w].ime}</span>
      <span class="track"><span class="fill" style="width:${Math.max(8,x.avg/maxW*100)}%${col?`;background:${col}`:""}"></span></span>
      <span class="val">${x.avg} dana · ${x.n} ${x.n===1?'faza':'faza'}</span></div>`;
  }).join("");

  const lateRows=late.length?late.slice().sort((a,b)=>b.days-a.days).map(c=>
    `<div class="latebox" onclick="openDossier('${c.id}')" title="Otvori dosije predmeta">${av(c.worker,true)} <b>${c.ime}</b> <span style="color:var(--muted);font-size:12px">· ${PHASES[c.phase]} · zadužen/a: <b style="color:var(--brand)">${WORKERS[c.worker].ime}</b></span><span class="pill late">${c.days} dana</span></div>`).join("")
    :`<div style="color:var(--muted);font-size:13px">Nema predmeta koji kasne. 👍</div>`;

  el.innerHTML=`<div class="report">
    ${kpis}
    <div class="grid2">
      <div class="panel"><h3>Tok predmeta kroz faze (trenutno stanje)</h3><div class="cols">${colChart}</div></div>
      <div class="panel"><h3>Raspodjela po tipu vize</h3><div class="donut-wrap">${donutSVG(visaSegs,CASES.length)}<div class="legend">${legend}</div></div></div>
    </div>
    <div class="panel"><h3>Prosječno trajanje po fazi — usko grlo: <span style="color:var(--late)">${PHASES[slowIdx]}</span></h3>${bars}</div>
    <div class="grid2">
      <div class="panel"><h3>Opterećenje po radniku (aktivni predmeti)</h3>${loadRows}</div>
      <div class="panel"><h3 style="display:flex;align-items:center;gap:8px">Prosječna brzina rada po radniku <span style="color:var(--muted);font-weight:500;font-size:11px">(Ø dana po fazi — manje je brže)</span><button class="analyze-btn" onclick="openAnalysis()">📊 Analiza rada</button></h3>${speedRows}</div>
    </div>
    <div class="panel"><h3>Predmeti koji kasne (≥ 5 dana u fazi)</h3>${lateRows}</div>
    <p style="color:var(--muted);font-size:12px">* Sve brojke se računaju iz podataka u realnom vremenu.</p>
  </div>`;
}

// ---- Dosije ----------------------------------------------------------------
let auditLog=[];
// Audit izveden iz stvarne historije faza (otvaranje + svako prosljeđivanje + završetak)
function buildAudit(c){
  const ev=[{date:c.hist[0][2],who:c.hist[0][4],type:"open",label:"Predmet otvoren"}];
  for(let i=0;i<c.hist.length;i++){
    const h=c.hist[i];
    if(!h[3]) continue; // faza još u toku
    if(h[0]===PHASES.length-1){
      ev.push({date:h[3],who:h[4],type:"done",label:`Predmet završen — ${PHASES[h[0]]}`});
    } else {
      const next=c.hist[i+1];
      const nextWho=next?next[4]:WORKERS[PHASE_WORKER[h[0]+1]].ime;
      ev.push({date:h[3],who:h[4],type:"handoff",label:`Završena faza: ${PHASES[h[0]]}`,extra:`→ ${PHASES[h[0]+1]} · preuzima ${nextWho}`});
    }
  }
  return ev;
}
function openDossier(id){
  const c=CASES.find(x=>x.id===id);
  const totalStart=c.hist[0][2];
  const docsHtml=c.docs.map(d=>`<div class="doc"><span class="ext ${d[1]}">${d[1].toUpperCase()}</span><span>${d[0]}</span><span class="dmeta">${d[3]}<br>${d[2]}</span></div>`).join("");
  const msgHtml=c.msgs.map(m=>{
    const w=code(m[0]);
    const ini=w||m[0].split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase();
    const col=w?WORKERS[w].boja:"#8a93a0";
    return `<div class="cmsg"><span class="cav" style="background:${col}">${ini}</span>
      <div class="cbubble"><div class="chead"><b>${m[0]}</b><span class="ctime">${m[1]}</span></div><div class="ctext">${m[2]}</div></div></div>`;
  }).join("");
  const histHtml=c.hist.map(h=>{
    const isCurr=h[3]===null; const dur=h[3]?durDays(h[2],h[3])+" dana":"u toku";
    return `<div class="item ${isCurr?'curr':'done'}"><div class="t">${h[1]}</div><div class="d">${h[2]} → ${h[3]||"…"} · ${dur} · ${h[4]}</div></div>`;
  }).join("");
  const AICON={open:"📂",handoff:"➡️",done:"✅",comment:"💬",return:"↩️",doc:"📎"};
  const events=[...buildAudit(c), ...auditLog.filter(a=>a.id===id)].sort((a,b)=>parse(a.date)-parse(b.date));
  const auditHtml=events.map(e=>`<div class="ai ${e.type}">
        <div class="ad">${e.date}${e.time?" · "+e.time:""}</div>
        <div class="al">${AICON[e.type]||"•"} ${e.label}</div>
        <div class="ae">${e.extra?e.extra+" · ":""}${e.who}</div>
      </div>`).join("");
  const canHandoff=c.phase<PHASES.length-1 && !c.done;
  const nextW=canHandoff?WORKERS[PHASE_WORKER[c.phase+1]].ime:null;
  const nextPh=canHandoff?PHASES[c.phase+1]:null;

  document.getElementById("dossier").innerHTML=`
    <div class="dhead">
      <div><h2>${c.ime}</h2>
        <div class="tags"><span class="tag">${c.id}</span><span class="tag">${c.visa}</span>
        <span class="tag">Faza: ${PHASES[c.phase]}</span>
        <span class="tag">Zadužen/a: ${WORKERS[c.worker].ime}</span>
        <span class="tag">Otvoren: ${durDays(totalStart, c.done?c.hist[c.hist.length-1][3]:todayStr())} dana</span></div>
      </div><div class="x" onclick="closeDossier()">×</div>
    </div>
    <div class="dbody">
      <div class="dcol">
        <div class="sec"><h3>Podaci o klijentu</h3>
          <div class="kv"><span class="k">Datum rođenja</span><span class="v">${c.rodjen}</span></div>
          <div class="kv"><span class="k">Pasoš</span><span class="v">${c.pasos}</span></div>
          <div class="kv"><span class="k">Državljanstvo</span><span class="v">${c.drz}</span></div>
          <div class="kv"><span class="k">Telefon</span><span class="v">${c.tel}</span></div>
          <div class="kv"><span class="k">E-mail</span><span class="v">${c.email}</span></div>
          <div class="kv"><span class="k">Predmet otvoren</span><span class="v">${c.otvoren}</span></div>
        </div>
        <div class="sec"><h3>Dokumenti (${c.docs.length})</h3>${docsHtml}
          <input type="file" id="d_file" accept=".pdf,.jpg,.jpeg,.xlsx,.xls" style="display:none" onchange="addDoc('${c.id}',this)">
          <button class="docbtn" onclick="document.getElementById('d_file').click()">📎 Dodaj dokument</button>
        </div>
      </div>
      <div class="dcol">
        <div class="sec"><h3>Audit — izmjene</h3><div class="atl">${auditHtml}</div></div>
        <div class="sec"><h3>Komunikacija i napomene</h3>
          <div class="addcom">
            <input id="c_new" placeholder="Dodaj komentar..." onkeydown="if(event.key==='Enter')addComment('${c.id}')">
            <button onclick="addComment('${c.id}')">Dodaj</button>
          </div><div class="cthread">${msgHtml}</div></div>
      </div>
    </div>
    <div class="actions">
      ${c.phase>0?`<button class="secondary" onclick="returnPhase('${c.id}')">← Vrati u prethodnu fazu</button>`:''}
      ${canHandoff
        ? `<button class="primary" onclick="handoff('${c.id}')">✓ Završi fazu i proslijedi</button>
           <span class="note">→ ${nextPh} · preuzima <b>${nextW}</b></span>`
        : `<span class="note">${c.done?'Predmet je završen.':'Posljednja faza.'}</span>`}
    </div>`;
  document.getElementById("overlay").classList.add("open");
}
function handoff(id){
  const c=CASES.find(x=>x.id===id);
  const h=c.hist.find(x=>x[3]===null); if(h) h[3]=todayStr();
  c.phase++; c.days=0; c.worker=PHASE_WORKER[c.phase];
  c.hist.push([c.phase,PHASES[c.phase],todayStr(),(c.phase===PHASES.length-1?todayStr():null),WORKERS[c.worker].ime]);
  if(c.phase===PHASES.length-1) c.done=true;
  if(view==="board") renderBoard();
  openDossier(id);
}
function closeDossier(){document.getElementById("overlay").classList.remove("open");}

function createCase(){
  const ime=(document.getElementById("f_ime").value||"").trim();
  if(!ime){document.getElementById("f_ime").focus();return;}
  const visa=document.getElementById("f_visa").value;
  const tel=(document.getElementById("f_tel").value||"").trim()||"—";
  const email=(document.getElementById("f_email").value||"").trim()||"—";
  const note=(document.getElementById("f_note").value||"").trim();
  const nextNum=Math.max(...CASES.map(c=>+c.id.split("-")[1]))+1;
  const id="P-"+nextNum;
  CASES.push({ id, ime, visa, phase:0, days:0, worker:"MM",
    rodjen:"—", pasos:"—", drz:"BiH", tel, email, otvoren:todayStr(),
    docs:[],
    msgs:[[LOGGED, todayStr()+" "+nowStr(), note||"Predmet otvoren."]],
    hist:[[0,PHASES[0],todayStr(),null,WORKERS.MM.ime]] });
  setView("board");
  openDossier(id);
}

// ---- Vraćanje u prethodnu fazu ---------------------------------------------
function returnPhase(id){
  const c=CASES.find(x=>x.id===id);
  if(c.phase===0) return;
  const leaving=PHASES[c.phase];
  // ukloni zapis trenutne faze iz historije
  for(let i=c.hist.length-1;i>=0;i--){ if(c.hist[i][0]===c.phase){ c.hist.splice(i,1); break; } }
  c.phase--; c.done=false; c.days=0; c.worker=PHASE_WORKER[c.phase];
  // ponovo otvori prethodnu fazu (vrati je u tok)
  for(let i=c.hist.length-1;i>=0;i--){ if(c.hist[i][0]===c.phase){ c.hist[i][3]=null; c.hist[i][4]=WORKERS[c.worker].ime; break; } }
  auditLog.push({id,date:todayStr(),time:nowStr(),who:LOGGED,type:"return",label:`Vraćeno u „${PHASES[c.phase]}"`,extra:`iz „${leaving}"`});
  if(view==="board") renderBoard();
  openDossier(id);
}

// ---- Dodavanje komentara ---------------------------------------------------
function addComment(id){
  const inp=document.getElementById("c_new");
  const txt=(inp.value||"").trim();
  if(!txt) return;
  const c=CASES.find(x=>x.id===id);
  c.msgs.unshift([LOGGED, todayStr()+" "+nowStr(), txt]);   // najnoviji na vrh
  auditLog.push({id,date:todayStr(),time:nowStr(),who:LOGGED,type:"comment",label:"Dodat komentar",extra:`„${txt.length>60?txt.slice(0,60)+"…":txt}"`});
  openDossier(id);  // osvježi dosije
}

// ---- Dodavanje dokumenta ---------------------------------------------------
function addDoc(id,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  if(!["pdf","jpg","jpeg","xlsx","xls"].includes(ext)){
    alert("Podržani formati: PDF, JPG, JPEG, Excel (xlsx/xls)."); input.value=""; return;
  }
  const name=f.name.replace(/\.[^.]+$/,"");
  const c=CASES.find(x=>x.id===id);
  c.docs.push([name,ext,todayStr(),LOGGED]);
  auditLog.push({id,date:todayStr(),time:nowStr(),who:LOGGED,type:"doc",label:"Dodat dokument",extra:`${name}.${ext}`});
  input.value="";
  openDossier(id);
}

// ---- helpers ---------------------------------------------------------------
function parse(d){const[g,m,y]=d.split(".").map(Number);return new Date(y,m-1,g);}
function durDays(a,b){return Math.max(0,Math.round((parse(b)-parse(a))/864e5));}
function todayStr(){return "04.06.2026";}
function nowStr(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

renderBoard();
</script>

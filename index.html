<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kancelarija Sarić — Sistem za vođenje predmeta (demo)</title>
<style>
  :root{
    --brand:#0e4f5c; --brand2:#15748a; --gold:#c79a3b; --action:#157f7f;
    --bg:#f2f6f7; --card:#fff; --line:#e1e8ea; --muted:#65737a;
    --ok:#1f9d55; --warn:#d9822b; --late:#cc2f2f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#16242a}
  /* Header / brand */
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:11px 20px;display:flex;align-items:center;gap:13px}
  .monogram{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.5px}
  .brand .name{font-weight:700;font-size:16px;line-height:1}
  .brand .tag{font-size:11.5px;color:var(--gold);letter-spacing:.4px;margin-top:3px}
  header .spacer{flex:1}
  header .badge{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px;font-size:11.5px}
  header .user{display:flex;align-items:center;gap:8px;font-size:13px}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  /* Toolbar with tabs */
  .toolbar{display:flex;align-items:center;gap:6px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
  .tab{padding:14px 14px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
  .tab.active{color:var(--brand);border-bottom-color:var(--gold)}
  .demo-flag{margin-left:12px;background:#fff4e5;color:#9a5b13;border:1px solid #f0d2a8;padding:4px 10px;border-radius:6px;font-size:12px;align-self:center}
  /* Kanban */
  .board{display:flex;gap:14px;padding:18px 20px;overflow-x:auto;align-items:flex-start}
  .col{background:#e9eff0;border:1px solid var(--line);border-radius:10px;min-width:248px;max-width:248px;display:flex;flex-direction:column}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--brand);margin:0;padding:12px 12px 8px}
  .col .count{color:var(--muted);font-weight:500}
  .col .cards{padding:0 10px 12px;display:flex;flex-direction:column;gap:9px;min-height:30px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;box-shadow:0 1px 2px rgba(20,40,50,.05);transition:.12s}
  .pcard:hover{box-shadow:0 4px 12px rgba(20,50,60,.13);transform:translateY(-1px);border-color:#c5d3d6}
  .pcard .nm{font-weight:650;font-size:14px}
  .pcard .visa{font-size:12px;color:var(--muted);margin-top:1px}
  .pcard .meta{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px}
  .pill{padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.days{background:#e6f2f3;color:#15677a}
  .pill.late{background:#fdecec;color:var(--late)}
  .pill.done{background:#e7f6ee;color:var(--ok)}
  .pcard .who{margin-left:auto}
  /* Report */
  .report{padding:20px}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 18px;min-width:170px;flex:1}
  .stat .big{font-size:30px;font-weight:700;color:var(--brand)}
  .stat .lab{font-size:12.5px;color:var(--muted);margin-top:3px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--brand)}
  .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar .blab{width:210px;color:#2a3a40}
  .bar .track{flex:1;background:#eef2f3;border-radius:6px;height:18px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand2),var(--brand))}
  .bar .fill.max{background:linear-gradient(90deg,#e0913a,var(--late))}
  .bar .val{width:64px;text-align:right;color:var(--muted)}
  .wl{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
  .wl .who{margin-left:auto;font-weight:600;color:var(--brand)}
  .latebox{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px}
  .latebox .pill{margin-left:auto}
  /* Dossier modal */
  .overlay{position:fixed;inset:0;background:rgba(10,25,30,.5);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .dossier{background:#fff;border-radius:14px;max-width:930px;width:100%;box-shadow:0 20px 60px rgba(5,20,25,.35);overflow:hidden}
  .dhead{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 22px;display:flex;align-items:flex-start;gap:14px}
  .dhead .x{margin-left:auto;cursor:pointer;font-size:22px;opacity:.85;line-height:1}
  .dhead h2{margin:0;font-size:20px}
  .dhead .tags{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
  .dhead .tag{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:6px}
  .dbody{display:grid;grid-template-columns:1.1fr 1fr}
  .dcol{padding:18px 22px}
  .dcol+.dcol{border-left:1px solid var(--line)}
  .sec{margin-bottom:20px}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--brand);margin:0 0 9px}
  .kv{display:flex;font-size:13.5px;padding:3px 0}
  .kv .k{width:120px;color:var(--muted)}
  .kv .v{font-weight:550}
  .doc{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
  .doc .ext{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px}
  .ext.pdf{background:#cc2f2f}.ext.jpg,.ext.jpeg{background:#2f80ed}.ext.xlsx{background:#1f9d55}
  .doc .dmeta{margin-left:auto;color:var(--muted);font-size:11.5px;text-align:right}
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:5px;top:3px;bottom:3px;width:2px;background:var(--line)}
  .tl .item{position:relative;padding:0 0 14px}
  .tl .item::before{content:"";position:absolute;left:-16px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand2)}
  .tl .item.done::before{background:var(--ok);border-color:var(--ok)}
  .tl .item.curr::before{background:var(--warn);border-color:var(--warn)}
  .tl .t{font-size:13.5px;font-weight:600}
  .tl .d{font-size:11.5px;color:var(--muted)}
  .msg{font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .msg .head{font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .actions{padding:14px 22px;background:#f5f9fa;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
  button.primary{background:var(--action);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13.5px}
  button.primary:hover{filter:brightness(1.08)}
  button.secondary{background:#fff;color:var(--brand);border:1px solid #c5d3d6;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13.5px}
  button.secondary:hover{background:#eef4f5}
  .newbtn{margin-left:auto;background:var(--action);color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;align-self:center}
  .newbtn:hover{filter:brightness(1.08)}
  .frow{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
  .frow label{font-size:12px;color:var(--muted);font-weight:600}
  .frow input,.frow select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  .frow input:focus,.frow select:focus{outline:none;border-color:var(--brand2)}
  .addcom{display:flex;gap:8px;margin-bottom:12px}
  .addcom input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
  .addcom input:focus{outline:none;border-color:var(--brand2)}
  .addcom button{padding:8px 14px;font-size:13px;border:0;border-radius:8px;background:var(--action);color:#fff;font-weight:600;cursor:pointer}
  .addcom button:hover{filter:brightness(1.08)}
  .actions .note{font-size:12px;color:var(--muted)}
  .audit{font-size:11.5px;color:var(--muted)}
  .audit .row{padding:2px 0}
  footer{padding:14px 20px;color:var(--muted);font-size:12px;text-align:center}
  @media(max-width:760px){.dbody{grid-template-columns:1fr}.dcol+.dcol{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>

// trenutni radnik = podrazumijevani radnik trenutne faze
CASES.forEach(c=>c.worker=PHASE_WORKER[c.phase]);

// ---- View switching --------------------------------------------------------
let view="board";
function setView(v){
  view=v;
  document.getElementById("tab-board").classList.toggle("active",v==="board");
  document.getElementById("tab-report").classList.toggle("active",v==="report");
  v==="board"?renderBoard():renderReport();
}

// ---- Kanban ----------------------------------------------------------------
function renderBoard(){
  const el=document.getElementById("view");
  const board=document.createElement("div"); board.className="board";
  PHASES.forEach((ph,i)=>{
    const inCol=CASES.filter(c=>c.phase===i);
    const col=document.createElement("div"); col.className="col";
    col.innerHTML=`<h2>${ph} <span class="count">(${inCol.length})</span></h2><div class="cards"></div>`;
    const cards=col.querySelector(".cards");
    inCol.forEach(c=>{
      const late=c.days>=5 && !c.done;
      const daysPill=c.done?`<span class="pill done">završeno</span>`
        :`<span class="pill ${late?'late':'days'}">${c.days} ${c.days===1?'dan':'dana'} u fazi</span>`;
      const card=document.createElement("div"); card.className="pcard"; card.onclick=()=>openDossier(c.id);
      card.innerHTML=`<div class="nm">${c.ime}</div><div class="visa">${c.visa} · ${c.id}</div>
        <div class="meta">${daysPill}<span class="who">${av(c.worker,true)}</span></div>`;
      cards.appendChild(card);
    });
    board.appendChild(col);
  });
  el.replaceChildren(board);
}

// ---- Izvještaji ------------------------------------------------------------
function renderReport(){
  const el=document.getElementById("view");
  const active=CASES.filter(c=>!c.done);
  const doneC=CASES.filter(c=>c.done);
  // prosječno trajanje (otvoren → danas ili kraj)
  const totals=CASES.map(c=>durDays(c.otvoren, c.done?c.hist[c.hist.length-1][3]:todayStr()));
  const avgTotal=Math.round(totals.reduce((a,b)=>a+b,0)/totals.length);
  // prosječno trajanje po fazi (iz završenih instanci faza)
  const perPhase=PHASES.map(()=>[]);
  CASES.forEach(c=>c.hist.forEach(h=>{ if(h[3]) perPhase[h[0]].push(durDays(h[2],h[3])); }));
  const phaseAvg=perPhase.map(a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0);
  const maxAvg=Math.max(...phaseAvg);
  const slowIdx=phaseAvg.indexOf(maxAvg);
  // predmeti po radniku (aktivni)
  const load={}; active.forEach(c=>load[c.worker]=(load[c.worker]||0)+1);
  // kašnjenja
  const late=active.filter(c=>c.days>=5);

  const bars=phaseAvg.map((v,i)=>`
    <div class="bar"><span class="blab">${PHASES[i]}</span>
      <span class="track"><span class="fill ${i===slowIdx?'max':''}" style="width:${maxAvg?Math.max(6,v/maxAvg*100):0}%"></span></span>
      <span class="val">${v} dana</span></div>`).join("");
  const loadRows=Object.keys(load).sort((a,b)=>load[b]-load[a]).map(k=>
    `<div class="wl">${av(k,true)} ${WORKERS[k].ime} <span style="color:var(--muted);font-size:12px">· ${WORKERS[k].uloga}</span><span class="who">${load[k]} ${load[k]===1?'predmet':'predmeta'}</span></div>`).join("");
  const lateRows=late.length?late.map(c=>
    `<div class="latebox">${av(c.worker,true)} <b>${c.ime}</b> <span style="color:var(--muted);font-size:12px">· ${PHASES[c.phase]} · zadužen/a: <b style="color:var(--brand)">${WORKERS[c.worker].ime}</b></span><span class="pill late">${c.days} dana</span></div>`).join("")
    :`<div style="color:var(--muted);font-size:13px">Nema predmeta koji kasne. 👍</div>`;

  el.innerHTML=`<div class="report">
    <div class="stat-row">
      <div class="stat"><div class="big">${active.length}</div><div class="lab">Aktivnih predmeta</div></div>
      <div class="stat"><div class="big">${doneC.length}</div><div class="lab">Završeno (ovaj mjesec)</div></div>
      <div class="stat"><div class="big">${avgTotal}</div><div class="lab">Prosj. trajanje predmeta (dana)</div></div>
      <div class="stat"><div class="big" style="color:var(--late)">${late.length}</div><div class="lab">Predmeta koji kasne</div></div>
    </div>
    <div class="panel">
      <h3>Prosječno trajanje po fazi — usko grlo: <span style="color:var(--late)">${PHASES[slowIdx]}</span></h3>
      ${bars}
    </div>
    <div class="panel"><h3>Opterećenje po radniku (aktivni predmeti)</h3>${loadRows}</div>
    <div class="panel"><h3>Predmeti koji kasne (≥ 5 dana u fazi)</h3>${lateRows}</div>
    <p style="color:var(--muted);font-size:12px">* Brojke su izračunate iz demo podataka u realnom vremenu.</p>
  </div>`;
}

// ---- Dosije ----------------------------------------------------------------
let auditLog=[];
function openDossier(id){
  const c=CASES.find(x=>x.id===id);
  const totalStart=c.hist[0][2];
  const docsHtml=c.docs.map(d=>`<div class="doc"><span class="ext ${d[1]}">${d[1].toUpperCase()}</span><span>${d[0]}</span><span class="dmeta">${d[3]}<br>${d[2]}</span></div>`).join("");
  const msgHtml=c.msgs.map(m=>`<div class="msg"><div class="head">${m[0]} · ${m[1]}</div>${m[2]}</div>`).join("");
  const histHtml=c.hist.map(h=>{
    const isCurr=h[3]===null; const dur=h[3]?durDays(h[2],h[3])+" dana":"u toku";
    return `<div class="item ${isCurr?'curr':'done'}"><div class="t">${h[1]}</div><div class="d">${h[2]} → ${h[3]||"…"} · ${dur} · ${h[4]}</div></div>`;
  }).join("");
  const auditHtml=auditLog.filter(a=>a.id===id).map(a=>`<div class="row">• ${a.txt}</div>`).join("")||`<div class="row">• Predmet otvoren ${c.otvoren} (Marija Mudrinić)</div>`;
  const canHandoff=c.phase<PHASES.length-1 && !c.done;
  const nextW=canHandoff?WORKERS[PHASE_WORKER[c.phase+1]].ime:null;
  const nextPh=canHandoff?PHASES[c.phase+1]:null;

  document.getElementById("dossier").innerHTML=`
    <div class="dhead">
      <div><h2>${c.ime}</h2>
        <div class="tags"><span class="tag">${c.id}</span><span class="tag">${c.visa}</span>
        <span class="tag">Faza: ${PHASES[c.phase]}</span>
        <span class="tag">Zadužen/a: ${WORKERS[c.worker].ime}</span>
        <span class="tag">Otvoren: ${durDays(totalStart, c.done?c.hist[c.hist.length-1][3]:todayStr())} dana</span></div>
      </div><div class="x" onclick="closeDossier()">×</div>
    </div>
    <div class="dbody">
      <div class="dcol">
        <div class="sec"><h3>Podaci o klijentu</h3>
          <div class="kv"><span class="k">Datum rođenja</span><span class="v">${c.rodjen}</span></div>
          <div class="kv"><span class="k">Pasoš</span><span class="v">${c.pasos}</span></div>
          <div class="kv"><span class="k">Državljanstvo</span><span class="v">${c.drz}</span></div>
          <div class="kv"><span class="k">Telefon</span><span class="v">${c.tel}</span></div>
          <div class="kv"><span class="k">E-mail</span><span class="v">${c.email}</span></div>
          <div class="kv"><span class="k">Predmet otvoren</span><span class="v">${c.otvoren}</span></div>
        </div>
        <div class="sec"><h3>Dokumenti (${c.docs.length})</h3>${docsHtml}</div>
        <div class="sec"><h3>Audit — izmjene</h3><div class="audit">${auditHtml}</div></div>
      </div>
      <div class="dcol">
        <div class="sec"><h3>Historija faza</h3><div class="tl">${histHtml}</div></div>
        <div class="sec"><h3>Komunikacija i napomene</h3>
          <div class="addcom">
            <input id="c_new" placeholder="Dodaj komentar..." onkeydown="if(event.key==='Enter')addComment('${c.id}')">
            <button onclick="addComment('${c.id}')">Dodaj</button>
          </div>${msgHtml}</div>
      </div>
    </div>
    <div class="actions">
      ${c.phase>0?`<button class="secondary" onclick="returnPhase('${c.id}')">← Vrati u prethodnu fazu</button>`:''}
      ${canHandoff
        ? `<button class="primary" onclick="handoff('${c.id}')">✓ Završi fazu i proslijedi</button>
           <span class="note">→ ${nextPh} · preuzima <b>${nextW}</b></span>`
        : `<span class="note">${c.done?'Predmet je završen.':'Posljednja faza.'}</span>`}
    </div>`;
  document.getElementById("overlay").classList.add("open");
}
function handoff(id){
  const c=CASES.find(x=>x.id===id);
  const finished=PHASES[c.phase]; const finishedBy=WORKERS[c.worker].ime;
  const h=c.hist.find(x=>x[3]===null); if(h) h[3]=todayStr();
  c.phase++; c.days=0; c.worker=PHASE_WORKER[c.phase];
  c.hist.push([c.phase,PHASES[c.phase],todayStr(),(c.phase===PHASES.length-1?todayStr():null),WORKERS[c.worker].ime]);
  if(c.phase===PHASES.length-1) c.done=true;
  auditLog.push({id,txt:`Faza „${finished}" označena gotovom — ${finishedBy}, ${todayStr()} ${nowStr()}. Proslijeđeno: ${WORKERS[c.worker].ime}.`});
  if(view==="board") renderBoard();
  openDossier(id);
}
function closeDossier(){document.getElementById("overlay").classList.remove("open");}

// ---- Novi predmet ----------------------------------------------------------
const VISA_TIPOVI=["Radna viza","Spajanje porodice","Studentska viza","Priznavanje kvalifikacija","Produženje vize","Studije u Sloveniji","Državljanstvo"];
function openNewCase(){
  document.getElementById("dossier").innerHTML=`
    <div class="dhead"><div><h2>Novi predmet</h2>
      <div class="tags"><span class="tag">Ulazi u fazu: ${PHASES[0]}</span><span class="tag">Preuzima: ${WORKERS.MM.ime}</span></div>
      </div><div class="x" onclick="closeDossier()">×</div></div>
    <div style="padding:20px 22px">
      <div class="frow"><label>Ime i prezime *</label><input id="f_ime" placeholder="npr. Ime Prezime"></div>
      <div class="frow"><label>Tip vize</label><select id="f_visa">${VISA_TIPOVI.map(v=>`<option>${v}</option>`).join("")}</select></div>
      <div class="frow"><label>Telefon</label><input id="f_tel" placeholder="+387 ..."></div>
      <div class="frow"><label>E-mail</label><input id="f_email" placeholder="email@primjer.com"></div>
      <div class="frow"><label>Napomena (opciono)</label><input id="f_note" placeholder="kratka napomena uz otvaranje predmeta"></div>
    </div>
    <div class="actions"><button class="primary" onclick="createCase()">Kreiraj predmet</button>
      <span class="note">Predmet se otvara i dodjeljuje za prijem (${WORKERS.MM.ime}).</span></div>`;
  document.getElementById("overlay").classList.add("open");
  setTimeout(()=>document.getElementById("f_ime").focus(),50);
}
function createCase(){
  const ime=(document.getElementById("f_ime").value||"").trim();
  if(!ime){document.getElementById("f_ime").focus();return;}
  const visa=document.getElementById("f_visa").value;
  const tel=(document.getElementById("f_tel").value||"").trim()||"—";
  const email=(document.getElementById("f_email").value||"").trim()||"—";
  const note=(document.getElementById("f_note").value||"").trim();
  const nextNum=Math.max(...CASES.map(c=>+c.id.split("-")[1]))+1;
  const id="P-"+nextNum;
  CASES.push({ id, ime, visa, phase:0, days:0, worker:"MM",
    rodjen:"—", pasos:"—", drz:"BiH", tel, email, otvoren:todayStr(),
    docs:[],
    msgs:[[LOGGED, todayStr()+" "+nowStr(), note||"Predmet otvoren."]],
    hist:[[0,PHASES[0],todayStr(),null,WORKERS.MM.ime]] });
  auditLog.push({id,txt:`Predmet kreiran — ${LOGGED}, ${todayStr()} ${nowStr()}.`});
  setView("board");
  openDossier(id);
}

// ---- Vraćanje u prethodnu fazu ---------------------------------------------
function returnPhase(id){
  const c=CASES.find(x=>x.id===id);
  if(c.phase===0) return;
  const leaving=PHASES[c.phase];
  // ukloni zapis trenutne faze iz historije
  for(let i=c.hist.length-1;i>=0;i--){ if(c.hist[i][0]===c.phase){ c.hist.splice(i,1); break; } }
  c.phase--; c.done=false; c.days=0; c.worker=PHASE_WORKER[c.phase];
  // ponovo otvori prethodnu fazu (vrati je u tok)
  for(let i=c.hist.length-1;i>=0;i--){ if(c.hist[i][0]===c.phase){ c.hist[i][3]=null; c.hist[i][4]=WORKERS[c.worker].ime; break; } }
  auditLog.push({id,txt:`Predmet vraćen iz faze „${leaving}" u „${PHASES[c.phase]}" — ${LOGGED}, ${todayStr()} ${nowStr()}.`});
  if(view==="board") renderBoard();
  openDossier(id);
}

// ---- Dodavanje komentara ---------------------------------------------------
function addComment(id){
  const inp=document.getElementById("c_new");
  const txt=(inp.value||"").trim();
  if(!txt) return;
  const c=CASES.find(x=>x.id===id);
  c.msgs.unshift([LOGGED, todayStr()+" "+nowStr(), txt]);   // najnoviji na vrh
  auditLog.push({id,txt:`Dodat komentar — ${LOGGED}, ${todayStr()} ${nowStr()}.`});
  openDossier(id);  // osvježi dosije
}

// ---- helpers ---------------------------------------------------------------
function parse(d){const[g,m,y]=d.split(".").map(Number);return new Date(y,m-1,g);}
function durDays(a,b){return Math.max(0,Math.round((parse(b)-parse(a))/864e5));}
function todayStr(){return "04.06.2026";}
function nowStr(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

renderBoard();
</script>
</body>
</html>
